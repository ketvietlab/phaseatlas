schemaVersion: phaseatlas.task/v1
id: PHA-006
title: Complete cancellation, resume, and stale-result safeguards
kind: code
phase: execution-resilience
state: in_review
priority: high
objective: Runs can be cancelled or resumed from persisted state without losing event continuity,
  and results from obsolete task revisions are prevented from being promoted as current evidence.
owners: []
dependencies:
  - taskKey: PHA-005
    relation: blocks_start
    requiredState: done
scope:
  allowedPaths:
    - packages/contracts/src/index.ts
    - apps/repository-worker/src
    - apps/desktop/src/repository-process-manager.ts
    - packages/core/src
    - docs/contracts/agent-run-contract.md
    - docs/contracts/task-contract.md
  forbiddenPaths: []
  writable: true
  allowDependencyChanges: false
  allowDatabaseMigrations: false
  allowExternalNetwork: false
acceptanceCriteria:
  - id: AC-1
    statement: Cancellation terminates the provider process, records one terminal status, releases its
      lease, and remains idempotent when requested repeatedly.
    verification:
      type: human
      reviewerRole: PhaseAtlas maintainer
  - id: AC-2
    statement: After worker or application restart, consumers resume strictly after their last persisted
      sequence without gaps or duplicates.
    verification:
      type: human
      reviewerRole: PhaseAtlas maintainer
  - id: AC-3
    statement: A result whose task revision no longer matches the canonical task is labeled stale and
      cannot be promoted until revalidated.
    verification:
      type: human
      reviewerRole: PhaseAtlas maintainer
  - id: AC-4
    statement: Interrupted runs expose an explicit recovery decision and are never silently reported as
      completed.
    verification:
      type: human
      reviewerRole: PhaseAtlas maintainer
verification: []
evidenceRequirements:
  - type: human_review
content:
  path: PHA-006.md
