schemaVersion: phaseatlas.task/v1
id: PHA-007
title: Build the execution history and run workbench
kind: code
phase: execution-experience
state: done
priority: high
objective: Users can start permitted task actions, inspect durable run history and live normalized
  events, review commands and changed files, cancel active runs, and recognize interrupted or stale
  results through the typed desktop API.
owners: []
dependencies:
  - taskKey: PHA-006
    relation: blocks_start
    requiredState: done
scope:
  allowedPaths:
    - packages/contracts/src/index.ts
    - apps/desktop/src/preload.ts
    - apps/desktop/src/main.ts
    - apps/desktop/src/repository-process-manager.ts
    - apps/repository-worker/src/index.ts
    - apps/ui/src/routes/+page.svelte
    - apps/ui/src/app.css
    - docs/development.md
  forbiddenPaths: []
  writable: true
  allowDependencyChanges: false
  allowDatabaseMigrations: false
  allowExternalNetwork: false
acceptanceCriteria:
  - id: AC-1
    statement: The typed preload API exposes only bounded run-start, history, event-resume,
      cancellation, and result-review operations.
    verification:
      type: human
      reviewerRole: PhaseAtlas maintainer
  - id: AC-2
    statement: The workbench renders persisted history, live status, ordered timeline events, command
      cards, verification outcomes, and repository-relative changed-file summaries.
    verification:
      type: human
      reviewerRole: PhaseAtlas maintainer
  - id: AC-3
    statement: Refresh or application restart restores run history and resumes active event views after
      the last displayed sequence.
    verification:
      type: human
      reviewerRole: PhaseAtlas maintainer
  - id: AC-4
    statement: Destructive or write-capable actions require clear confirmation and unavailable actions
      explain the blocking policy or capability.
    verification:
      type: human
      reviewerRole: PhaseAtlas maintainer
  - id: AC-5
    statement: Keyboard navigation, focus visibility, contrast, dark theme, and reduced-motion behavior
      meet the established renderer design requirements.
    verification:
      type: human
      reviewerRole: PhaseAtlas maintainer
verification: []
evidenceRequirements:
  - type: human_review
content:
  path: PHA-007.md
