schemaVersion: phaseatlas.task/v1
id: PHA-001
title: Define the legacy source adapter contract
kind: research
phase: legacy-ingestion
state: planned
priority: normal
objective: Establish an approved, deterministic contract for converting selected legacy repository
  documents into PhaseAtlas task candidates without weakening canonical YAML authority.
owners: []
dependencies: []
scope:
  allowedPaths:
    - docs/contracts/task-contract.md
    - docs/architecture/overview.md
    - packages/contracts/src/index.ts
    - packages/core/src
  forbiddenPaths: []
  writable: false
  allowDependencyChanges: false
  allowDatabaseMigrations: false
  allowExternalNetwork: false
acceptanceCriteria:
  - id: AC-1
    statement: The supported legacy source formats, precedence rules, identity mapping, and
      unsupported-input behavior are documented with representative fixtures.
    verification:
      type: human
      reviewerRole: PhaseAtlas maintainer
  - id: AC-2
    statement: The contract preserves Git-tracked canonical YAML as the only authoritative task source
      and requires ambiguous conversions to fail closed.
    verification:
      type: human
      reviewerRole: PhaseAtlas maintainer
verification: []
evidenceRequirements:
  - type: human_review
content:
  path: PHA-001.md
