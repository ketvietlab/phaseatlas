schemaVersion: phaseatlas.task/v1
id: PHA-008
title: Package and verify the desktop release pipeline
kind: operations
phase: distribution
state: planned
priority: normal
objective: PhaseAtlas produces installable desktop artifacts that load the static renderer, locate
  bundled worker code, preserve sandbox boundaries, and enforce explicit signing and update policies
  without embedding credentials.
owners: []
dependencies:
  - taskKey: PHA-003
    relation: blocks_start
    requiredState: done
  - taskKey: PHA-007
    relation: blocks_start
    requiredState: done
  - taskKey: PHA-011
    relation: blocks_start
    requiredState: done
scope:
  allowedPaths:
    - package.json
    - pnpm-workspace.yaml
    - apps/desktop/package.json
    - apps/desktop/src/main.ts
    - apps/desktop/tsup.config.ts
    - apps/ui/package.json
    - apps/ui/vite.config.ts
    - scripts
    - docs/development.md
    - docs/architecture/overview.md
  forbiddenPaths: []
  writable: true
  allowDependencyChanges: false
  allowDatabaseMigrations: false
  allowExternalNetwork: false
acceptanceCriteria:
  - id: AC-1
    statement: A production build loads the bundled static renderer and starts the bundled repository
      worker without a development server.
    verification:
      type: human
      reviewerRole: PhaseAtlas maintainer
  - id: AC-2
    statement: Packaged renderer sandboxing and the typed preload boundary match development behavior.
    verification:
      type: human
      reviewerRole: PhaseAtlas maintainer
  - id: AC-3
    statement: Release-mode builds fail closed when required signing or notarization inputs are absent,
      while development artifacts contain no credentials.
    verification:
      type: human
      reviewerRole: PhaseAtlas maintainer
  - id: AC-4
    statement: Update configuration verifies signed metadata and does not enable unsolicited update
      network activity in development or test modes.
    verification:
      type: human
      reviewerRole: PhaseAtlas maintainer
  - id: AC-5
    statement: Supported-platform build, signing, notarization, installation, update, and rollback
      procedures are documented with accountable verification evidence.
    verification:
      type: human
      reviewerRole: PhaseAtlas maintainer
verification: []
evidenceRequirements:
  - type: human_review
