schemaVersion: phaseatlas.task/v1
id: PHA-010
title: Deliver the desktop agent chat workspace
kind: code
phase: agent-chat-desktop
state: done
priority: high
objective: The desktop application provides a professional multi-session repository chat workspace
  with streaming messages, tool activity, provider/model visibility, attachments, and durable reload
  recovery so users do not need to switch to Codex, Claude, or Cursor for ordinary repository dialogue.
