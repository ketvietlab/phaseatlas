  allowedPaths:
    - packages/contracts/src/index.ts
    - apps/desktop/src/main.ts
    - apps/desktop/src/preload.ts
    - apps/desktop/src/repository-process-manager.ts
    - apps/ui/src
    - apps/ui/package.json
    - pnpm-lock.yaml
    - docs/development.md
    - .phaseatlas/workspaces/repository-agent-chat
  forbiddenPaths: []
  writable: true
  allowDependencyChanges: true
  allowDatabaseMigrations: false
  allowExternalNetwork: false
acceptanceCriteria:
  - id: AC-1
    statement: A repository-level Chat action opens a workspace with session history, transcript, and
      composer without requiring a selected workspace or task.
    verification:
      type: human
      reviewerRole: PhaseAtlas maintainer
  - id: AC-2
    statement: Multiple chat sessions stream and recover independently, and reload reconstructs each
      transcript exactly once from persisted sequence cursors.
    verification:
      type: human
      reviewerRole: PhaseAtlas maintainer
  - id: AC-3
    statement: Tool calls, command lifecycle, file references, failures, cancellation, and provider
      silence are rendered as structured activity rather than an apparently frozen terminal.
    verification:
      type: human
      reviewerRole: PhaseAtlas maintainer
  - id: AC-4
    statement: The chat workspace is keyboard accessible, responsive, theme-aware, and uses the same
      KétViệt operational design system as the repository workbench.
    verification:
      type: human
      reviewerRole: PhaseAtlas maintainer
