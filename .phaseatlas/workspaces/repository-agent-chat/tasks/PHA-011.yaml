schemaVersion: phaseatlas.task/v1
id: PHA-011
title: Add isolated chat edit mode and task handoff
kind: code
phase: agent-chat-editing
state: planned
priority: high
objective: A task-independent chat can enter an explicitly confirmed edit mode in an isolated
  worktree, present validated diffs and verification for review, and optionally create a reviewed
  canonical task proposal from the conversation without granting the chat canonical authority.
owners: []
dependencies:
  - taskKey: PHA-010
    relation: blocks_start
    requiredState: done
scope:
  allowedPaths:
    - packages/contracts/src/index.ts
    - packages/core/src
    - apps/repository-worker/src
    - apps/desktop/src
    - apps/ui/src
    - docs/contracts
    - docs/development.md
    - .phaseatlas/workspaces/repository-agent-chat
  forbiddenPaths: []
  writable: true
  allowDependencyChanges: false
  allowDatabaseMigrations: false
  allowExternalNetwork: false
acceptanceCriteria:
  - id: AC-1
    statement: Entering chat edit mode requires explicit confirmation of repository, provider, model,
      writable scope, and isolated-worktree behavior before a provider process starts.
    verification:
      type: human
      reviewerRole: PhaseAtlas maintainer
  - id: AC-2
    statement: Every edit turn uses an owned isolated worktree, enforces bounded paths, persists
      normalized activity, and releases or retains the lease according to an auditable disposition.
    verification:
      type: human
      reviewerRole: PhaseAtlas maintainer
  - id: AC-3
    statement: Users can review changed files, diffs, verification, blockers, and the next action before
      explicitly accepting, discarding, or continuing an edit attempt.
    verification:
      type: human
      reviewerRole: PhaseAtlas maintainer
  - id: AC-4
    statement: Creating a task from a conversation produces editable proposals that pass the canonical
      publisher; chat output cannot directly write task YAML, mark a task done, or promote evidence.
    verification:
      type: human
      reviewerRole: PhaseAtlas maintainer
verification: []
evidenceRequirements:
  - type: human_review
content:
  path: PHA-011.md
