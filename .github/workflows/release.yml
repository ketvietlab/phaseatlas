name: Release macOS

on:
  push:
    tags:
      - "v*.*.*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate:
    name: Validate release contract
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out the tagged revision
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version

      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack install --global pnpm@11.9.0

      - name: Require the release commit on main
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "Release tags must point to a commit contained by main." >&2
            exit 1
          fi

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate version and changelog
        run: node scripts/validate-release.mjs --tag "$GITHUB_REF_NAME"

      - name: Check source
        run: pnpm check

      - name: Run tests
        run: pnpm test

  build:
    name: Build macOS ${{ matrix.architecture }}
    needs: validate
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    environment: production
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            architecture: arm64
          - runner: macos-15-intel
            architecture: x64
    steps:
      - name: Check out the tagged revision
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version

      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack install --global pnpm@11.9.0

      - name: Confirm runner architecture
        shell: bash
        run: |
          set -euo pipefail
          actual_architecture="$(node -p 'process.arch')"
          test "$actual_architecture" = "${{ matrix.architecture }}"

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Import Apple signing and notarization credentials
        shell: bash
        env:
          APPLE_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$APPLE_CERTIFICATE_P12_BASE64"
          test -n "$APPLE_CERTIFICATE_PASSWORD"
          test -n "$APPLE_SIGNING_IDENTITY"
          test -n "$APPLE_ID"
          test -n "$APPLE_TEAM_ID"
          test -n "$APPLE_APP_SPECIFIC_PASSWORD"

          certificate_path="$RUNNER_TEMP/phaseatlas-signing.p12"
          keychain_path="$RUNNER_TEMP/phaseatlas-signing.keychain-db"
          keychain_password="$(openssl rand -base64 32)"
          echo "::add-mask::$keychain_password"

          CERTIFICATE_PATH="$certificate_path" node -e \
            'require("node:fs").writeFileSync(process.env.CERTIFICATE_PATH, Buffer.from(process.env.APPLE_CERTIFICATE_P12_BASE64, "base64"))'
          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security import "$certificate_path" -k "$keychain_path" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain_path"
          security list-keychains -d user -s "$keychain_path"
          security find-identity -v -p codesigning "$keychain_path" | grep -F -- "$APPLE_SIGNING_IDENTITY" >/dev/null

          xcrun notarytool store-credentials phaseatlas-ci \
            --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            --keychain "$keychain_path"

          {
            echo "PHASEATLAS_NOTARIZATION_KEYCHAIN=$keychain_path"
            echo "PHASEATLAS_NOTARIZATION_PROFILE=phaseatlas-ci"
            echo "PHASEATLAS_SIGNING_KEYCHAIN=$keychain_path"
          } >> "$GITHUB_ENV"

      - name: Create signed update descriptor
        shell: bash
        env:
          UPDATE_SIGNING_PRIVATE_KEY_BASE64: ${{ secrets.UPDATE_SIGNING_PRIVATE_KEY_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$UPDATE_SIGNING_PRIVATE_KEY_BASE64"
          private_key="$RUNNER_TEMP/update-private-key.pem"
          public_key="$RUNNER_TEMP/update-public-key.pem"
          manifest="$RUNNER_TEMP/update-manifest.json"
          signature="$RUNNER_TEMP/update-manifest.sig"

          PRIVATE_KEY_PATH="$private_key" node -e \
            'require("node:fs").writeFileSync(process.env.PRIVATE_KEY_PATH, Buffer.from(process.env.UPDATE_SIGNING_PRIVATE_KEY_BASE64, "base64"))'
          node scripts/create-release-metadata.mjs \
            --tag "$GITHUB_REF_NAME" \
            --repository "$GITHUB_REPOSITORY" \
            --output "$manifest"
          openssl pkey -in "$private_key" -pubout -out "$public_key"
          openssl dgst -sha256 -sign "$private_key" -out "$signature" "$manifest"

          {
            echo "PHASEATLAS_UPDATE_PUBLIC_KEY_FILE=$public_key"
            echo "PHASEATLAS_UPDATE_MANIFEST_FILE=$manifest"
            echo "PHASEATLAS_UPDATE_SIGNATURE_FILE=$signature"
          } >> "$GITHUB_ENV"

      - name: Build, sign, and notarize application
        env:
          PHASEATLAS_BUILD_NUMBER: ${{ github.run_number }}
          PHASEATLAS_RELEASE_CHANNEL: release
          PHASEATLAS_SIGN_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          PHASEATLAS_UPDATE_FEED_URL: https://github.com/${{ github.repository }}/releases/latest/download/update-manifest.json
        run: pnpm package:desktop

      - name: Verify signed application
        shell: bash
        run: |
          set -euo pipefail
          pnpm verify:desktop
          xcrun stapler validate "artifacts/desktop/darwin-${{ matrix.architecture }}/PhaseAtlas.app"
          spctl --assess --type execute --verbose=4 "artifacts/desktop/darwin-${{ matrix.architecture }}/PhaseAtlas.app"

      - name: Upload architecture artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: phaseatlas-darwin-${{ matrix.architecture }}
          path: artifacts/desktop/darwin-${{ matrix.architecture }}/*.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Remove temporary keychain
        if: always()
        shell: bash
        run: |
          if test -n "${PHASEATLAS_SIGNING_KEYCHAIN:-}"; then
            security delete-keychain "$PHASEATLAS_SIGNING_KEYCHAIN" || true
          fi
          rm -f \
            "$RUNNER_TEMP/phaseatlas-signing.p12" \
            "$RUNNER_TEMP/update-private-key.pem" \
            "$RUNNER_TEMP/update-public-key.pem" \
            "$RUNNER_TEMP/update-manifest.sig"

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: production
    permissions:
      contents: write
    steps:
      - name: Check out the tagged revision
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Download notarized applications
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          pattern: phaseatlas-darwin-*
          path: release-assets
          merge-multiple: true

      - name: Prepare release notes and signed update metadata
        shell: bash
        env:
          UPDATE_SIGNING_PRIVATE_KEY_BASE64: ${{ secrets.UPDATE_SIGNING_PRIVATE_KEY_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$UPDATE_SIGNING_PRIVATE_KEY_BASE64"
          node scripts/validate-release.mjs \
            --tag "$GITHUB_REF_NAME" \
            --notes-output "$RUNNER_TEMP/release-notes.md"

          private_key="$RUNNER_TEMP/update-private-key.pem"
          PRIVATE_KEY_PATH="$private_key" node -e \
            'require("node:fs").writeFileSync(process.env.PRIVATE_KEY_PATH, Buffer.from(process.env.UPDATE_SIGNING_PRIVATE_KEY_BASE64, "base64"))'
          node scripts/create-release-metadata.mjs \
            --tag "$GITHUB_REF_NAME" \
            --repository "$GITHUB_REPOSITORY" \
            --assets-dir release-assets \
            --output release-assets/update-manifest.json
          openssl pkey -in "$private_key" -pubout -out release-assets/update-public-key.pem
          openssl dgst -sha256 \
            -sign "$private_key" \
            -out release-assets/update-manifest.sig \
            release-assets/update-manifest.json
          openssl dgst -sha256 \
            -verify release-assets/update-public-key.pem \
            -signature release-assets/update-manifest.sig \
            release-assets/update-manifest.json
          (
            cd release-assets
            sha256sum PhaseAtlas-*.zip update-manifest.json update-manifest.sig update-public-key.pem > SHA256SUMS.txt
          )

      - name: Create or update GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          release_options=()
          if [[ "$version" == *-* ]]; then
            release_options+=(--prerelease)
          fi

          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" release-assets/* --clobber --repo "$GITHUB_REPOSITORY"
            gh release edit "$GITHUB_REF_NAME" \
              --title "PhaseAtlas $version" \
              --notes-file "$RUNNER_TEMP/release-notes.md" \
              --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$GITHUB_REF_NAME" release-assets/* \
              --verify-tag \
              --title "PhaseAtlas $version" \
              --notes-file "$RUNNER_TEMP/release-notes.md" \
              --repo "$GITHUB_REPOSITORY" \
              "${release_options[@]}"
          fi

      - name: Retain the complete release set
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: phaseatlas-release-${{ github.ref_name }}
          path: release-assets
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

      - name: Remove update signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/update-private-key.pem"
